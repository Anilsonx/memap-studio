<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MeMap Studio</title>
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel para rodar JSX direto no navegador sem precisar de build -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f19; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 select-none">
  <div id="root" class="w-full h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Ícones simplificados SVG integrados (sem dependência externa)
    const Icons = {
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
      Trash: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
      Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>,
      Sparkles: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>,
      Layout: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>,
      Install: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 2v13M5 10l7 7 7-7M5 21h14"/></svg>
    };

    const INITIAL_NODES = [
      { id: '1', title: 'MeMap Studio', desc: 'Seu mapa mental inteligente PWA pronto no celular!', x: 260, y: 180, color: '#6366f1', tags: ['Início'] },
      { id: '2', title: 'Ideia 1', desc: 'Toque nas bordas para ligar com outros nós', x: 580, y: 100, color: '#10b981', tags: ['Fluxo'] },
      { id: '3', title: 'Ideia 2', desc: 'Arraste livremente pela tela', x: 580, y: 260, color: '#f59e0b', tags: ['Dica'] }
    ];

    const INITIAL_CONNS = [
      { id: 'c1', from: '1', to: '2', fromPort: 'right', toPort: 'left', label: 'Conecta' },
      { id: 'c2', from: '1', to: '3', fromPort: 'right', toPort: 'left', label: 'Desdobra' }
    ];

    function App() {
      const [nodes, setNodes] = useState(() => {
        const saved = localStorage.getItem('memap_nodes');
        return saved ? JSON.parse(saved) : INITIAL_NODES;
      });
      const [connections, setConnections] = useState(() => {
        const saved = localStorage.getItem('memap_conns');
        return saved ? JSON.parse(saved) : INITIAL_CONNS;
      });

      const [selectedNode, setSelectedNode] = useState(null);
      const [viewMode, setViewMode] = useState('full'); // full, simple, notag, borderless
      const [pan, setPan] = useState({ x: 20, y: 40 });
      const [zoom, setZoom] = useState(1);
      const [connectingFrom, setConnectingFrom] = useState(null);
      const [draggedNode, setDraggedNode] = useState(null);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      // Auto-save
      useEffect(() => {
        localStorage.setItem('memap_nodes', JSON.stringify(nodes));
        localStorage.setItem('memap_conns', JSON.stringify(connections));
      }, [nodes, connections]);

      // PWA Manifest dinâmico & Install prompt
      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        });

        const manifest = {
          name: "MeMap Studio",
          short_name: "MeMap",
          start_url: "/",
          display: "standalone",
          background_color: "#0b0f19",
          theme_color: "#6366f1"
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      }, []);

      const handleInstall = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => setDeferredPrompt(null));
        } else {
          alert("Para instalar no iPhone: toque no ícone Compartilhar do Safari e selecione 'Adicionar à Tela de Início'. No Android: use os 3 pontinhos do Chrome > Instalar Aplicativo.");
        }
      };

      const addNode = () => {
        const id = Date.now().toString();
        const newNode = {
          id,
          title: `Novo Tópico ${nodes.length + 1}`,
          desc: 'Descrição rápida do tópico...',
          x: -pan.x + window.innerWidth / 2 - 80,
          y: -pan.y + window.innerHeight / 2 - 40,
          color: '#3b82f6',
          tags: ['Anotação']
        };
        setNodes([...nodes, newNode]);
        setSelectedNode(newNode);
      };

      const deleteNode = (id, e) => {
        if (e) e.stopPropagation();
        setNodes(nodes.filter(n => n.id !== id));
        setConnections(connections.filter(c => c.from !== id && c.to !== id));
        if (selectedNode?.id === id) setSelectedNode(null);
      };

      const getPortPos = (node, port) => {
        const w = 180, h = 90;
        switch(port) {
          case 'top': return { x: node.x + w/2, y: node.y };
          case 'bottom': return { x: node.x + w/2, y: node.y + h };
          case 'left': return { x: node.x, y: node.y + h/2 };
          case 'right': return { x: node.x + w, y: node.y + h/2 };
          default: return { x: node.x + w/2, y: node.y + h/2 };
        }
      };

      const onNodeTouchStart = (node, e) => {
        e.stopPropagation();
        const touch = e.touches[0];
        setDraggedNode(node.id);
        setDragStart({ x: touch.clientX - node.x, y: touch.clientY - node.y });
      };

      const onTouchMove = (e) => {
        if (!draggedNode) return;
        const touch = e.touches[0];
        setNodes(nodes.map(n => n.id === draggedNode ? {
          ...n,
          x: touch.clientX - dragStart.x,
          y: touch.clientY - dragStart.y
        } : n));
      };

      const onTouchEnd = () => setDraggedNode(null);

      return (
        <div 
          className="w-full h-full relative overflow-hidden flex flex-col"
          onTouchMove={onTouchMove}
          onTouchEnd={onTouchEnd}
        >
          {/* Topbar compacta e completa para Mobile e Desktop */}
          <header className="h-14 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between px-3 z-30 shrink-0">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">
                M
              </div>
              <span className="font-bold text-sm tracking-wide text-white">MeMap</span>
              <span className="text-[10px] bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded font-mono">PWA</span>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
              <button onClick={addNode} className="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 py-1.5 rounded-md font-medium shadow active:scale-95 transition">
                <Icons.Plus /> <span>Nó</span>
              </button>

              <select 
                value={viewMode} 
                onChange={(e) => setViewMode(e.target.value)}
                className="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-md px-2 py-1.5 outline-none cursor-pointer"
              >
                <option value="full">Completo</option>
                <option value="simple">Simplificado</option>
                <option value="notag">Sem Tags</option>
                <option value="borderless">Sem Bordas</option>
              </select>

              <button onClick={handleInstall} className="flex items-center gap-1 bg-emerald-600/90 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded-md font-medium shadow active:scale-95 transition">
                <Icons.Install /> <span className="hidden sm:inline">Instalar</span>
              </button>
            </div>
          </header>

          {/* Canvas interativo com SVG de conexões */}
          <div className="flex-1 relative w-full h-full overflow-hidden bg-slate-950 cursor-grab">
            <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
              {connections.map(conn => {
                const fn = nodes.find(n => n.id === conn.from);
                const tn = nodes.find(n => n.id === conn.to);
                if (!fn || !tn) return null;
                const p1 = getPortPos(fn, conn.fromPort || 'right');
                const p2 = getPortPos(tn, conn.toPort || 'left');
                const mx = (p1.x + p2.x) / 2;
                const my = (p1.y + p2.y) / 2;
                const path = `M ${p1.x} ${p1.y} C ${p1.x + 50} ${p1.y}, ${p2.x - 50} ${p2.y}, ${p2.x} ${p2.y}`;

                return (
                  <g key={conn.id}>
                    <path d={path} fill="none" stroke="#6366f1" strokeWidth="2.5" strokeOpacity="0.8" />
                    {conn.label && (
                      <g transform={`translate(${mx}, ${my})`}>
                        <rect x="-35" y="-10" width="70" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" strokeWidth="1" />
                        <text textAnchor="middle" dominantBaseline="central" fill="#c7d2fe" fontSize="10" fontWeight="600">
                          {conn.label}
                        </text>
                      </g>
                    )}
                  </g>
                );
              })}
            </svg>

            {/* Renderização dos Nós */}
            {nodes.map(node => (
              <div
                key={node.id}
                onTouchStart={(e) => onNodeTouchStart(node, e)}
                onClick={() => setSelectedNode(node)}
                style={{
                  transform: `translate(${node.x}px, ${node.y}px)`,
                  width: '180px',
                  minHeight: viewMode === 'simple' ? '60px' : '90px'
                }}
                className={`absolute z-20 rounded-xl transition-shadow cursor-pointer select-none p-3 ${
                  viewMode === 'borderless' 
                    ? 'bg-slate-900/60 shadow-lg' 
                    : 'bg-slate-900/95 border border-slate-700/80 shadow-xl'
                } ${selectedNode?.id === node.id ? 'ring-2 ring-indigo-500 shadow-indigo-500/20' : ''}`}
              >
                {/* Indicador de cor */}
                <div className="w-full h-1 rounded-full mb-2" style={{ backgroundColor: node.color }} />

                <div className="flex items-start justify-between gap-1">
                  <h3 className="font-semibold text-xs text-white leading-tight truncate">{node.title}</h3>
                  <button 
                    onClick={(e) => deleteNode(node.id, e)}
                    className="text-slate-500 hover:text-red-400 p-0.5"
                  >
                    <Icons.Trash />
                  </button>
                </div>

                <p className="text-[11px] text-slate-400 mt-1 line-clamp-2 leading-relaxed">{node.desc}</p>

                {viewMode !== 'simple' && viewMode !== 'notag' && node.tags && (
                  <div className="flex gap-1 mt-2 flex-wrap">
                    {node.tags.map((t, idx) => (
                      <span key={idx} className="text-[9px] bg-slate-800 text-indigo-300 px-1.5 py-0.5 rounded">
                        {t}
                      </span>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Painel inferior de edição (quando um nó é tocado) */}
          {selectedNode && (
            <div className="absolute bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 p-3 z-40 rounded-t-2xl shadow-2xl flex flex-col gap-2 max-w-lg mx-auto">
              <div className="flex justify-between items-center">
                <span className="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Editar Nó</span>
                <button onClick={() => setSelectedNode(null)} className="text-xs text-slate-400 hover:text-white px-2 py-0.5">Fechar ✕</button>
              </div>
              <input
                type="text"
                value={selectedNode.title}
                onChange={(e) => {
                  const updated = { ...selectedNode, title: e.target.value };
                  setSelectedNode(updated);
                  setNodes(nodes.map(n => n.id === updated.id ? updated : n));
                }}
                className="bg-slate-800 border border-slate-700 text-xs text-white rounded px-2.5 py-1.5 outline-none focus:border-indigo-500"
                placeholder="Título do nó"
              />
              <textarea
                value={selectedNode.desc}
                rows={2}
                onChange={(e) => {
                  const updated = { ...selectedNode, desc: e.target.value };
                  setSelectedNode(updated);
                  setNodes(nodes.map(n => n.id === updated.id ? updated : n));
                }}
                className="bg-slate-800 border border-slate-700 text-xs text-white rounded px-2.5 py-1.5 outline-none focus:border-indigo-500 resize-none"
                placeholder="Descrição"
              />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
